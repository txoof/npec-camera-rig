[project]
name = "npec-rig"
version = "0.1.0"
description = "Plant growth monitoring for an environmental chamber"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "numpy",
    "pillow",
    "jinja2",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "pytest-xdist",
    "pytest-timeout",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# --strict-config: without it, a run where pytest-timeout has not been installed turns the
# `timeout` below into a "Unknown config option" warning and the backstop silently disappears,
# which is the one failure this cap exists to prevent.
# -m 'unit and not timing': the default tier is every unit test except the ones whose result
# depends on how fast and how busy the machine is. See the `timing` marker below.
addopts = "-m 'unit and not timing' --strict-config"
# No unit test may take two minutes. The cap is a backstop against a hang, not a budget: the whole
# tier runs in about 50 s on an x86 box and 250 s on a Pi, so nothing legitimate comes near it.
#
# Without it a test that waits with no deadline takes the run down with it instead of failing. That
# is not hypothetical: tests/test_experiments.py's lock helper polled for ever in a thread that was
# not a daemon, and pytest could not exit. Run alone it was found alive at 13 minutes; in CI the
# only guard was the job's own 20-minute limit, which kills everything and names no test (#576).
#
# It applies to every tier, not just unit. There are no `slow` tests today; the first soak test
# that legitimately runs longer sets its own with @pytest.mark.timeout(...), rather than this
# being raised for everybody.
timeout = 120
# Only tests/: experiments/ holds analysis scripts, some named *_test.py, that read data at import (#167).
testpaths = ["tests"]
markers = [
    "unit: fast, no hardware, no accelerator (default tier, budget <15s; a bare pytest runs it on 4 cores)",
    "hardware: needs the camera",
    "hailo: needs the Hailo accelerator",
    "integration: full pipeline against fixture images",
    "slow: soak / long-running",
    "timing: a unit test whose result depends on how fast and how busy the machine is. Left out of the default tier, run with `pytest -m timing`. Not a second-class test: it checks real behaviour and is not known to be wrong. It is out because a test that fails on a busy machine while the rig is working makes the rule that a red test blocks the commit unusable (Aaron, 2026-11-27, #576)",
]
