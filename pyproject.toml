[project]
name = "npec-rig"
version = "0.1.0"
description = "Plant growth monitoring for an environmental chamber"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "numpy",
    "pillow",
    "jinja2",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "pytest-xdist",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-m unit"
# Only tests/: experiments/ holds analysis scripts, some named *_test.py, that read data at import (#167).
testpaths = ["tests"]
markers = [
    "unit: fast, no hardware, no accelerator (default tier, budget <15s; a bare pytest runs it on 4 cores)",
    "hardware: needs the camera",
    "hailo: needs the Hailo accelerator",
    "integration: full pipeline against fixture images",
    "slow: soak / long-running",
]
