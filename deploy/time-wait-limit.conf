# A limit on the wait for the network time at boot (#62), for systemd-time-wait-sync.service.
# Without it, a rig with no network would never start the app. 120 s is a choice, not a
# measurement: long enough for the network to come up after a power cut. When it runs out the
# wait fails, the app starts on the clock it has, and `systemctl --failed` lists
# systemd-time-wait-sync.service until the next boot.
#
#   sudo mkdir -p /etc/systemd/system/systemd-time-wait-sync.service.d
#   sudo cp deploy/time-wait-limit.conf /etc/systemd/system/systemd-time-wait-sync.service.d/limit.conf
#   sudo systemctl daemon-reload
[Service]
TimeoutStartSec=120
