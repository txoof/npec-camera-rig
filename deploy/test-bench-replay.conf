# Test bench only (#279): the rig's camera replays saved photos instead of using a camera.
# Never install this on the chamber Pi: every still it takes would be an old photo.
#
# On the test bench Pi (npec-rig-01):
#   sudo mkdir -p /etc/systemd/system/npec-rig.service.d
#   sudo cp deploy/test-bench-replay.conf /etc/systemd/system/npec-rig.service.d/replay.conf
#   sudo systemctl daemon-reload && sudo systemctl restart npec-rig
#
# Each still is the next JPEG in the folder, in name order, starting over after the last. Put
# the photos for one test in a folder of their own, named in the order they are to be taken
# with the same number of digits (01_..., 02_...: 10_ sorts before 2_). Hidden files are
# skipped. Change the folder here, then restart the service.
[Service]
Environment=NPEC_RIG_REPLAY_PHOTOS=/home/pi/replay/2026-10-21-validation
