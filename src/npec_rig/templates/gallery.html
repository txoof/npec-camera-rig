{% extends "base.html" %}
{% set nav_active = "gallery" %}
{% block title_suffix %} — Capture &amp; Gallery{% endblock %}

{% block content %}
  <h2>Capture</h2>
  <div class="capture-section">
    <button id="capture-btn">Capture</button>
  </div>

  <h2>Recent captures</h2>
  <div class="gallery" id="gallery"></div>

  <script>
    const captureBtn = document.getElementById("capture-btn");
    const gallery = document.getElementById("gallery");

    function duration(seconds) {
      if (seconds === null || seconds === undefined) return "unknown";
      if (seconds < 120) return `${Math.round(seconds)} s`;
      if (seconds < 7200) return `${Math.round(seconds / 60)} min`;
      return `${(seconds / 3600).toFixed(1)} h`;
    }

    function uptimeText(uptime) {
      const start = uptime.app_start || {};
      const gap = start.gap_s === null || start.gap_s === undefined
        ? "no earlier record"
        : `${duration(start.gap_s)}${start.same_boot ? "" : " (Pi restarted, by wall clock)"}`;
      return `Pi up ${duration(uptime.pi_up_s)}, app up ${duration(uptime.app_up_s)}, `
        + `gap before app start ${gap}`;
    }

    function renderGallery(items) {
      gallery.innerHTML = items.map((item) => `
        <div class="gallery-item">
          <img src="${item.url}" alt="capture ${item.filename}">
          <div>${item.timestamp ? item.timestamp.replace("T", " ").slice(0, 19) : item.filename}</div>
          ${item.uptime ? `<div>${uptimeText(item.uptime)}</div>` : ""}
          ${item.flags && item.flags.length
            ? `<div class="gallery-flag">Not covered by the validation bands:
                ${item.flags.join("; ")}</div>`
            : ""}
        </div>
      `).join("");
    }

    async function refreshGallery() {
      const r = await fetch("/api/captures");
      renderGallery(await r.json());
    }

    captureBtn.addEventListener("click", async () => {
      captureBtn.disabled = true;
      captureBtn.textContent = "Capturing...";
      try {
        await fetch("/capture", { method: "POST" });
        await refreshGallery();
      } finally {
        captureBtn.disabled = false;
        captureBtn.textContent = "Capture";
      }
    });
    refreshGallery();
  </script>
{% endblock %}
