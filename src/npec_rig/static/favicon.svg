<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A dicot leaf, kept to a blade, a stalk and a midrib so it reads at 16 px (#197).
       Colours meet WCAG G207 (3:1 for graphics): light, leaf 5.9:1 on #f1f3f4 and midrib 5.9:1
       on the leaf; dark, leaf 6.0:1 on #35363a and midrib 3.9:1 on the leaf. -->
  <style>
    .leaf { fill: #1e6b2a; stroke: #1e6b2a; }
    .rib { stroke: #e8f5e9; }
    @media (prefers-color-scheme: dark) {
      .leaf { fill: #81c784; stroke: #81c784; }
      .rib { stroke: #1b5e20; }
    }
  </style>
  <path class="leaf" d="M10 54 L3 61" stroke-width="6" stroke-linecap="round"/>
  <path class="leaf" d="M8 56 C2 24 26 2 62 2 C62 38 40 62 8 56 Z" stroke-width="0"/>
  <path class="rib" d="M13 51 L44 20" stroke-width="4.5" stroke-linecap="round"/>
</svg>
